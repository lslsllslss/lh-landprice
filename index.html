}
@media (prefers-color-scheme: dark) {

  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --card: #1b2029; --text: #e6e9ef; --muted: #9aa3b2; --line: #2b3240;
  --up: #f0845a; --down: #5ba3f0; --neutral: #6b7487;
  --g-res: #6aa0ee; --g-com: #f0a064; --g-ind: #ad93d6; --g-grn: #62bd8c;
  --warn: #e5b25d; --warn-bg: #3a2f17;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Pretendard', 'Malgun Gothic', system-ui, sans-serif; line-height: 1.5; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px 48px; }
header.top { padding: 24px 0 8px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
header.top h1 { margin: 0; font-size: 22px; }
header.top .sub { color: var(--muted); font-size: 13px; }
#filters { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 10px 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); margin-bottom: var(--gap); }
#filters select, #filters input, #filters button { font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); }
#filters button { cursor: pointer; }
#filters .seg button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
#filters .seg { display: inline-flex; gap: 0; }
#filters .seg button { border-radius: 0; }
#filters .seg button:first-child { border-radius: 8px 0 0 8px; }
#filters .seg button:last-child { border-radius: 0 8px 8px 0; }
#filters .tag { background: var(--text); color: var(--bg); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); margin-bottom: var(--gap); }
.grid .full { grid-column: 1 / -1; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.card h2 { margin: 0 0 4px; font-size: 15px; }
.card .desc { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
.card canvas { max-width: 100%; }
.chart-box { position: relative; height: 300px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap); margin-bottom: var(--gap); }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.kpi .label { color: var(--muted); font-size: 12px; }
.kpi .value { font-size: 26px; font-weight: 700; margin: 4px 0; }
.kpi .delta { font-size: 13px; }
.up { color: var(--up); } .down { color: var(--down); }
.badge { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); margin-right: 4px; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th, table.data td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
table.data th { cursor: pointer; position: sticky; top: 0; background: var(--card); }
table.data td.num, table.data th.num { text-align: right; }
.table-scroll { max-height: 520px; overflow: auto; }
@media (max-width: 800px) {
  .grid, .kpis { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

<script>
(function () {
  const all = window.PARCELS;
  const state = {
    filters: { dong: [], zone: [], zoneGroup: [], jimok: [], chgMin: null, chgMax: null, search: '' },
    metric: 'median' // median | mean | sum
  };
  const subs = [];

  function match(p, f) {
    if (f.dong.length && !f.dong.includes(p.dong)) return false;
    if (f.zone.length && !f.zone.includes(p.zone)) return false;
    if (f.zoneGroup.length && !f.zoneGroup.includes(p.zoneGroup)) return false;
    if (f.jimok.length && !f.jimok.includes(p.jimok)) return false;
    if (f.chgMin !== null && (p.chg === null || p.chg < f.chgMin)) return false;
    if (f.chgMax !== null && (p.chg === null || p.chg >= f.chgMax)) return false;
    if (f.search && !p.addr.includes(f.search)) return false;
    return true;
  }

  function notify() { subs.forEach(fn => fn(state)); }

  const Store = {
    all: all,
    get: () => state,
    // set({filters:{dong:['철산동']}, metric:'mean'}) — filters는 부분 병합
    set(partial) {
      if (partial.filters) Object.assign(state.filters, partial.filters);
      if (partial.metric) state.metric = partial.metric;
      notify();
    },
    reset() {
      state.filters = { dong: [], zone: [], zoneGroup: [], jimok: [], chgMin: null, chgMax: null, search: '' };
      notify();
    },
    // 토글: 같은 값을 다시 클릭하면 해제 (차트 클릭 연동용)
    toggle(key, value) {
      const arr = state.filters[key];
      const i = arr.indexOf(value);
      if (i >= 0) arr.splice(i, 1); else arr.push(value);
      notify();
    },
    subscribe(fn) { subs.push(fn); fn(state); },
    filtered() { return all.filter(p => match(p, state.filters)); },
    priced() { return Store.filtered().filter(p => !p.excluded); },
    // 지표 집계
    agg(values, metric) {
      const v = values.filter(x => x !== null && x !== undefined && !isNaN(x)).sort((a, b) => a - b);
      if (!v.length) return null;
      metric = metric || state.metric;
      if (metric === 'sum') return v.reduce((a, b) => a + b, 0);
      if (metric === 'mean') return v.reduce((a, b) => a + b, 0) / v.length;
      const m = v.length >> 1;
      return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
    },
    metricLabel: () => ({ median: '중앙값', mean: '평균', sum: '합계' }[state.metric]),
    // 포맷터
    fmtMan: n => n === null || n === undefined ? '-' : (n / 10000).toLocaleString('ko-KR', { maximumFractionDigits: 1 }) + '만',
    fmtWon: n => n === null || n === undefined ? '-' : Math.round(n).toLocaleString('ko-KR'),
    fmtPct: n => n === null || n === undefined ? '-' : (n > 0 ? '+' : '') + n.toFixed(1) + '%',
    // 색 (CSS 변수에서 읽음)
    css: name => getComputedStyle(document.documentElement).getPropertyValue(name).trim(),
    GROUPS: ['주거', '상업', '공업', '녹지'],
    DONGS: [...new Set(all.map(p => p.dong))],
    ZONES: [...new Set(all.map(p => p.zone))],
    JIMOKS: [...new Set(all.map(p => p.jimok).filter(Boolean))],
    FLAG_LABEL: { missing26: '2026 누락', scale: '자릿수 의심', extreme: '변동 과다', area0: '면적 0', nojimok: '지목 없음', dup: '중복 PNU' }
  };
  window.Store = Store;
})();

</script>
<script>
(function () {
  const el = document.getElementById('filters');
  function sel(key, label, opts) {
    return `<select data-k="${key}"><option value="">${label}: 전체</option>${opts.map(o => `<option>${o}</option>`).join('')}</select>`;
  }
  el.innerHTML =
    sel('dong', '법정동', Store.DONGS) +
    sel('zoneGroup', '용도 그룹', Store.GROUPS) +
    sel('zone', '용도지역', Store.ZONES) +
    sel('jimok', '지목', Store.JIMOKS) +
    '<input id="f-search" placeholder="소재지 검색">' +
    '<span class="seg" id="f-metric">' +
    ['median:중앙값', 'mean:평균', 'sum:합계'].map(s => { const [k, l] = s.split(':'); return `<button data-m="${k}">${l}</button>`; }).join('') +
    '</span><button id="f-reset">초기화</button><span id="f-tags"></span>';

  el.querySelectorAll('select').forEach(s => s.addEventListener('change', () => {
    Store.set({ filters: { [s.dataset.k]: s.value ? [s.value] : [] } });
  }));
  el.querySelector('#f-search').addEventListener('input', e => Store.set({ filters: { search: e.target.value.trim() } }));
  el.querySelectorAll('#f-metric button').forEach(b => b.addEventListener('click', () => Store.set({ metric: b.dataset.m })));
  el.querySelector('#f-reset').addEventListener('click', () => { el.querySelector('#f-search').value = ''; Store.reset(); });

  Store.subscribe(st => {
    el.querySelectorAll('select').forEach(s => { const v = st.filters[s.dataset.k]; s.value = v.length === 1 ? v[0] : ''; });
    el.querySelectorAll('#f-metric button').forEach(b => b.classList.toggle('on', b.dataset.m === st.metric));
    const f = st.filters, tags = [];
    ['dong', 'zoneGroup', 'zone', 'jimok'].forEach(k => f[k].forEach(v => tags.push(`<span class="tag" data-k="${k}" data-v="${v}">${v} ✕</span>`)));
    if (f.chgMin !== null || f.chgMax !== null) tags.push(`<span class="tag" data-k="chg">변동률 ${f.chgMin ?? '-∞'}~${f.chgMax ?? '∞'}% ✕</span>`);
    const t = el.querySelector('#f-tags');
    t.innerHTML = tags.join(' ');
    t.querySelectorAll('.tag').forEach(g => g.addEventListener('click', () => {
      if (g.dataset.k === 'chg') Store.set({ filters: { chgMin: null, chgMax: null } }); else Store.toggle(g.dataset.k, g.dataset.v);
    }));
  });
})();

</script>
<script>
(function () {
  const kpiEl = document.getElementById('sec-kpi');
  const chgEl = document.getElementById('sec-change');
  if (!kpiEl || !chgEl) return;

  const BINS = [
    { label: '-10% 미만', min: null, max: -10, side: 'down' },
    { label: '-10~0%', min: -10, max: 0, side: 'down' },
    { label: '0~5%', min: 0, max: 5, side: 'up' },
    { label: '5~10%', min: 5, max: 10, side: 'up' },
    { label: '10% 이상', min: 10, max: null, side: 'up' }
  ];
  const charts = { hist: null, up: null, down: null };

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const won = n => Store.fmtWon(n) + '원';
  const label = p => p.dong + ' ' + p.jibun;

  chgEl.innerHTML =
    '<h2>변동률 분석</h2>' +
    '<p class="desc">2025 → 2026 공시지가 변동률 분포와 상승·하락 상위 필지 (가격 집계 제외 필지 미포함). 분포 막대를 클릭하면 해당 구간으로 필터링됩니다.</p>' +
    '<div class="grid">' +
    '<div><h2>변동률 분포</h2><div class="chart-box" id="chg-hist-box"><canvas id="chg-hist"></canvas></div></div>' +
    '<div></div>' +
    '<div><h2>상승률 TOP10</h2><div class="chart-box" id="chg-up-box"><canvas id="chg-up"></canvas></div></div>' +
    '<div><h2>하락률 TOP10</h2><div class="chart-box" id="chg-down-box"><canvas id="chg-down"></canvas></div></div>' +
    '</div>';
  // 2열 그리드에서 분포 차트가 전체 폭을 쓰도록 빈 칸 제거
  chgEl.querySelector('.grid > div:nth-child(2)').remove();
  chgEl.querySelector('.grid > div:first-child').style.gridColumn = '1 / -1';

  function destroy(k) { if (charts[k]) { charts[k].destroy(); charts[k] = null; } }

  function empty(boxId, on) {
    const box = document.getElementById(boxId);
    let m = box.querySelector('.empty-msg');
    box.querySelector('canvas').style.display = on ? 'none' : '';
    if (on && !m) {
      m = document.createElement('div');
      m.className = 'empty-msg';
      m.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:13px';
      m.textContent = '표시할 데이터가 없습니다';
      box.appendChild(m);
    }
    if (!on && m) m.remove();
  }

  function axes(horizontal) {
    const muted = Store.css('--muted'), line = Store.css('--line');
    const val = { ticks: { color: muted }, grid: { color: line } };
    const cat = { ticks: { color: muted }, grid: { display: false } };
    return horizontal ? { x: val, y: cat } : { x: cat, y: val };
  }

  function renderKpi(st) {
    const filtered = Store.filtered();
    const priced = filtered.filter(p => !p.excluded);
    const excl = filtered.length - priced.length;
    const both = priced.filter(p => p.p25 != null && p.p26 != null);
    const v26 = Store.agg(priced.map(p => p.p26), st.metric);
    const v25 = Store.agg(both.map(p => p.p25), st.metric);
    const v26b = Store.agg(both.map(p => p.p26), st.metric);
    const delta = v25 && v26b !== null ? (v26b / v25 - 1) * 100 : null;
    const cls = delta === null ? '' : delta > 0 ? 'up' : delta < 0 ? 'down' : '';
    const arrow = delta === null ? '' : delta > 0 ? '▲ ' : delta < 0 ? '▼ ' : '';
    const withChg = priced.filter(p => p.chg !== null && p.chg !== undefined);
    const ups = withChg.filter(p => p.chg > 0).length;
    const downs = withChg.filter(p => p.chg < 0).length;
    const pct = n => withChg.length ? (n / withChg.length * 100).toFixed(1) + '%' : '-';
    let top = null;
    priced.forEach(p => { if (p.p26 != null && (!top || p.p26 > top.p26)) top = p; });
    const unit = st.metric === 'sum' ? ' (원, 합계)' : '/㎡';

    kpiEl.innerHTML =
      `<div class="kpi"><div class="label">전체 필지 수</div>` +
      `<div class="value">${filtered.length.toLocaleString('ko-KR')}필지</div>` +
      `<div class="delta" style="color:var(--muted)">${excl ? `가격 집계 제외 ${excl.toLocaleString('ko-KR')}필지` : '가격 집계 제외 없음'}</div></div>` +

      `<div class="kpi"><div class="label">2026 공시지가 ${Store.metricLabel()}</div>` +
      `<div class="value">${v26 === null ? '-' : Store.fmtMan(v26)}</div>` +
      `<div class="delta ${cls}">${delta === null ? '2025 대비 -' : `${arrow}2025 대비 ${Store.fmtPct(delta)}`}` +
      `<span style="color:var(--muted)"> · 원${st.metric === 'sum' ? '' : '/㎡'}</span></div></div>` +

      `<div class="kpi"><div class="label">상승 · 하락 필지</div>` +
      `<div class="value"><span class="up">${ups.toLocaleString('ko-KR')}</span> / <span class="down">${downs.toLocaleString('ko-KR')}</span></div>` +
      `<div class="delta"><span class="up">상승 ${pct(ups)}</span> · <span class="down">하락 ${pct(downs)}</span></div></div>` +

      `<div class="kpi"><div class="label">최고가 필지 (2026)</div>` +
      `<div class="value">${top ? Store.fmtMan(top.p26) : '-'}</div>` +
      `<div class="delta" style="color:var(--muted)">${top ? esc(top.addr) + ' · ' + won(top.p26) + '/㎡' : '표시할 데이터가 없습니다'}</div></div>`;
  }

  function renderHist(st) {
    // 변동률 필터 자체는 분포에서 제외해 전체 구간을 계속 보여준다
    const f = st.filters, sMin = f.chgMin, sMax = f.chgMax;
    f.chgMin = null; f.chgMax = null;
    let base;
    try { base = Store.priced(); } finally { f.chgMin = sMin; f.chgMax = sMax; }
    base = base.filter(p => p.chg !== null && p.chg !== undefined);

    destroy('hist');
    empty('chg-hist-box', base.length === 0);
    if (!base.length) return;

    const counts = BINS.map(b => base.filter(p => (b.min === null || p.chg >= b.min) && (b.max === null || p.chg < b.max)).length);
    const up = Store.css('--up'), down = Store.css('--down');
    const activeIdx = BINS.findIndex(b => b.min === sMin && b.max === sMax);
    const anyActive = sMin !== null || sMax !== null;
    const colors = BINS.map((b, i) => {
      const c = b.side === 'down' ? down : up;
      return anyActive && i !== activeIdx ? c + '55' : c;
    });

    charts.hist = new Chart(document.getElementById('chg-hist'), {
      type: 'bar',
      data: { labels: BINS.map(b => b.label), datasets: [{ label: '필지 수', data: counts, backgroundColor: colors, borderRadius: 4 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: c => `${c.parsed.y.toLocaleString('ko-KR')}필지 (${(c.parsed.y / base.length * 100).toFixed(1)}%)` } }
        },
        scales: axes(false),
        onClick: (e, els) => {
          if (!els.length) return;
          const b = BINS[els[0].index];
          const cur = Store.get().filters;
          if (cur.chgMin === b.min && cur.chgMax === b.max) Store.set({ filters: { chgMin: null, chgMax: null } });
          else Store.set({ filters: { chgMin: b.min, chgMax: b.max } });
        },
        onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; }
      }
    });
  }

  function renderTop(key, canvasId, boxId, rows, color) {
    destroy(key);
    empty(boxId, rows.length === 0);
    if (!rows.length) return;
    charts[key] = new Chart(document.getElementById(canvasId), {
      type: 'bar',
      data: { labels: rows.map(label), datasets: [{ label: '변동률', data: rows.map(p => +p.chg.toFixed(2)), backgroundColor: color, borderRadius: 4 }] },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: c => '변동률 ' + Store.fmtPct(c.parsed.x),
              afterLabel: c => {
                const p = rows[c.dataIndex];
                return ['2025: ' + won(p.p25) + '/㎡', '2026: ' + won(p.p26) + '/㎡'];
              }
            }
          }
        },
        scales: axes(true)
      }
    });
  }

  function renderRank() {
    const withChg = Store.priced().filter(p => p.chg !== null && p.chg !== undefined);
    const upRows = withChg.filter(p => p.chg > 0).sort((a, b) => b.chg - a.chg).slice(0, 10);
    const downRows = withChg.filter(p => p.chg < 0).sort((a, b) => a.chg - b.chg).slice(0, 10);
    renderTop('up', 'chg-up', 'chg-up-box', upRows, Store.css('--up'));
    renderTop('down', 'chg-down', 'chg-down-box', downRows, Store.css('--down'));
  }

  function render(st) {
    renderKpi(st);
    renderHist(st);
    renderRank();
  }

  Store.subscribe(render);

  // 다크모드 전환 시 색 재적용
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const h = () => render(Store.get());
    if (mq.addEventListener) mq.addEventListener('change', h);
  }
})();

</script>
<script>
(function () {
  const rootC = document.getElementById('sec-compare');
  const rootD = document.getElementById('sec-explore');
  if (!rootC || !rootD) return;

  const GROUP_VAR = { '주거': '--g-res', '상업': '--g-com', '공업': '--g-ind', '녹지': '--g-grn' };
  const MIN_N = 10;
  const charts = {};

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function gcolor(g) { return Store.css(GROUP_VAR[g] || '--neutral'); }
  function alpha(c, a) {
    c = (c || '').trim();
    let m = /^#([0-9a-f]{6})$/i.exec(c);
    if (m) {
      const n = parseInt(m[1], 16);
      return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
    }
    m = /^#([0-9a-f]{3})$/i.exec(c);
    if (m) {
      const h = m[1];
      return `rgba(${parseInt(h[0] + h[0], 16)},${parseInt(h[1] + h[1], 16)},${parseInt(h[2] + h[2], 16)},${a})`;
    }
    return c;
  }
  function groupBy(arr, fn) {
    const m = new Map();
    arr.forEach(p => { const k = fn(p); if (k === '' || k === null || k === undefined) return; if (!m.has(k)) m.set(k, []); m.get(k).push(p); });
    return m;
  }

  function card(parent, cls, title, desc, withCanvas, height) {
    const d = document.createElement('div');
    d.className = 'card' + (cls ? ' ' + cls : '');
    d.innerHTML = `<h2>${title}</h2><p class="desc"></p>` +
      (withCanvas ? `<div class="chart-box"${height ? ` style="height:${height}px"` : ''}><canvas></canvas><div class="empty-msg" style="display:none;position:absolute;inset:0;align-items:center;justify-content:center;color:var(--muted);font-size:13px;background:var(--card)">표시할 데이터가 없습니다</div></div>` : '<div class="body"></div>');
    d.querySelector('.desc').textContent = desc;
    parent.appendChild(d);
    return d;
  }

  const cDong = card(rootC, 'full', '법정동별 공시지가', '', true, 320);
  const cZone = card(rootC, '', '용도지역별 변동률', '', true, 300);
  const cJimok = card(rootC, '', '지목별 필지 수', '', true, 300);
  const cScatter = card(rootD, 'full', '면적 × 공시지가 산점도', '가로 면적(㎡), 세로 2026 공시지가(원/㎡), 모두 로그 스케일 · 면적 0·제외 필지 미표시', true, 380);
  const cHeat = card(rootD, 'full', '법정동 × 용도지역 히트맵', '', false);

  function setEmpty(c, empty) {
    const e = c.querySelector('.empty-msg');
    if (e) e.style.display = empty ? 'flex' : 'none';
  }

  function baseOpts(extra) {
    const muted = Store.css('--muted'), line = Store.css('--line');
    return Object.assign({
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { labels: { color: muted, boxWidth: 12 } } }
    }, extra || {}, { _muted: muted, _line: line });
  }
  function axis(muted, line, extra) {
    return Object.assign({ ticks: { color: muted }, grid: { color: line }, border: { color: line } }, extra || {});
  }

  function render(key, c, cfg, empty) {
    setEmpty(c, empty);
    if (charts[key]) { charts[key].destroy(); charts[key] = null; }
    if (empty) return;
    charts[key] = new Chart(c.querySelector('canvas'), cfg);
  }

  function setHeight(c, n, perBar, min) {
    c.querySelector('.chart-box').style.height = Math.max(min, n * perBar + 60) + 'px';
  }

  /* ---------- C-1 법정동별 ---------- */
  function drawDong(st, data) {
    const muted = Store.css('--muted'), line = Store.css('--line');
    const g = groupBy(data, p => p.dong);
    const dongs = Store.DONGS.filter(d => g.has(d));
    const ml = Store.metricLabel();
    cDong.querySelector('.desc').textContent = `법정동별 ${ml} 공시지가 · 2025 vs 2026 (원/㎡, 만 원 표기) · 막대를 클릭하면 해당 동으로 필터`;
    const v25 = dongs.map(d => Store.agg(g.get(d).map(p => p.p25), st.metric));
    const v26 = dongs.map(d => Store.agg(g.get(d).map(p => p.p26), st.metric));
    const sel = st.filters.dong;
    render('dong', cDong, {
      type: 'bar',
      data: {
        labels: dongs,
        datasets: [
          { label: '2025', data: v25, backgroundColor: alpha(Store.css('--neutral'), 0.85) },
          { label: '2026', data: v26, backgroundColor: dongs.map(d => !sel.length || sel.includes(d) ? Store.css('--up') : alpha(Store.css('--up'), 0.35)) }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: {
          legend: { labels: { color: muted, boxWidth: 12 } },
          tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${Store.fmtMan(ctx.parsed.y)} (${Store.fmtWon(ctx.parsed.y)}원/㎡)` } }
        },
        scales: {
          x: axis(muted, line),
          y: axis(muted, line, { beginAtZero: true, ticks: { color: muted, callback: v => Store.fmtMan(v) } })
        },
        onClick: (e, els) => { if (els.length) Store.toggle('dong', dongs[els[0].index]); },
        onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; }
      }
    }, !dongs.length);
  }

  /* ---------- C-2 용도지역별 변동률 ---------- */
  function drawZone(st, data) {
    const muted = Store.css('--muted'), line = Store.css('--line');
    const g = groupBy(data, p => p.zone);
    const metric = st.metric === 'sum' ? 'mean' : st.metric;
    const mlabel = metric === 'mean' ? '평균' : '중앙값';
    cZone.querySelector('.desc').textContent = `용도지역별 ${mlabel} 변동률(%)` + (st.metric === 'sum' ? ' (합계 선택 시 평균으로 표시)' : '') + ` · 필지 ${MIN_N}개 미만은 흐리게 표시 · 클릭 시 필터`;
    let rows = [...g.entries()].map(([z, arr]) => ({
      zone: z, n: arr.length, group: arr[0].zoneGroup,
      v: Store.agg(arr.map(p => p.chg), metric)
    })).filter(r => r.v !== null);
    rows.sort((a, b) => b.v - a.v);
    setHeight(cZone, rows.length, 28, 300);
    const sel = st.filters.zone;
    render('zone', cZone, {
      type: 'bar',
      data: {
        labels: rows.map(r => r.n < MIN_N ? `${r.zone} (n=${r.n})` : r.zone),
        datasets: [{
          label: `${mlabel} 변동률`, data: rows.map(r => r.v),
          backgroundColor: rows.map(r => {
            const dim = r.n < MIN_N || (sel.length && !sel.includes(r.zone));
            return alpha(gcolor(r.group), dim ? 0.35 : 1);
          })
        }]
      },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false, animation: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => `${mlabel} 변동률: ${Store.fmtPct(ctx.parsed.x)} · ${rows[ctx.dataIndex].group} · ${rows[ctx.dataIndex].n}필지` } }
        },
        scales: {
          x: axis(muted, line, { ticks: { color: muted, callback: v => v + '%' } }),
          y: axis(muted, line)
        },
        onClick: (e, els) => { if (els.length) Store.toggle('zone', rows[els[0].index].zone); },
        onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; }
      }
    }, !rows.length);
  }

  /* ---------- C-3 지목별 필지 수 ---------- */
  function drawJimok(st, filt) {
    const muted = Store.css('--muted'), line = Store.css('--line');
    cJimok.querySelector('.desc').textContent = '지목별 필지 수 (지목 없음 제외, 제외 필지 포함) · 클릭 시 필터';
    const g = groupBy(filt, p => p.jimok);
    const rows = [...g.entries()].map(([j, arr]) => ({ j, n: arr.length })).sort((a, b) => b.n - a.n);
    setHeight(cJimok, rows.length, 28, 300);
    const sel = st.filters.jimok;
    const base = Store.css('--g-res');
    render('jimok', cJimok, {
      type: 'bar',
      data: {
        labels: rows.map(r => r.j),
        datasets: [{ label: '필지 수', data: rows.map(r => r.n), backgroundColor: rows.map(r => !sel.length || sel.includes(r.j) ? base : alpha(base, 0.35)) }]
      },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false, animation: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => `${ctx.parsed.x.toLocaleString('ko-KR')}필지` } } },
        scales: { x: axis(muted, line, { beginAtZero: true }), y: axis(muted, line) },
        onClick: (e, els) => { if (els.length) Store.toggle('jimok', rows[els[0].index].j); },
        onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; }
      }
    }, !rows.length);
  }

  /* ---------- D-1 산점도 ---------- */
  function drawScatter(st, data) {
    const muted = Store.css('--muted'), line = Store.css('--line');
    const pts = data.filter(p => !p.excluded && p.area > 0 && p.p26 > 0 && !(p.flags || []).includes('area0'));
    const datasets = Store.GROUPS.map(g => ({
      label: g,
      data: pts.filter(p => p.zoneGroup === g).map(p => ({ x: p.area, y: p.p26, p })),
      backgroundColor: alpha(gcolor(g), 0.7), borderColor: gcolor(g), pointRadius: 4, pointHoverRadius: 6
    })).filter(d => d.data.length);
    render('scatter', cScatter, {
      type: 'scatter',
      data: { datasets },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: {
          legend: { labels: { color: muted, boxWidth: 12 } },
          tooltip: {
            callbacks: {
              title: items => items.length ? items[0].raw.p.addr : '',
              label: ctx => {
                const p = ctx.raw.p;
                return [`용도지역: ${p.zone} (${p.zoneGroup})`, `면적: ${p.area.toLocaleString('ko-KR')}㎡`, `2026: ${Store.fmtWon(p.p26)}원/㎡ (${Store.fmtMan(p.p26)})`];
              }
            }
          }
        },
        scales: {
          x: axis(muted, line, { type: 'logarithmic', title: { display: true, text: '면적 (㎡)', color: muted }, ticks: { color: muted, callback: v => [1, 10, 100, 1000, 10000, 100000].includes(v) ? v.toLocaleString('ko-KR') : '' } }),
          y: axis(muted, line, { type: 'logarithmic', title: { display: true, text: '2026 공시지가 (원/㎡)', color: muted }, ticks: { color: muted, callback: v => { const l = Math.log10(v); return Math.abs(l - Math.round(l)) < 1e-9 || [2, 5].includes(v / Math.pow(10, Math.floor(l))) ? Store.fmtMan(v) : ''; } } })
        }
      }
    }, !pts.length);
  }

  /* ---------- D-2 히트맵 ---------- */
  function drawHeat(st, data) {
    const ml = Store.metricLabel();
    cHeat.querySelector('h2').textContent = '법정동 × 용도지역 히트맵';
    cHeat.querySelector('.desc').textContent = `2026 공시지가 ${ml} (만 원/㎡) · 셀 색 진할수록 높음 · 셀 클릭 시 해당 동·용도지역으로 필터`;
    const body = cHeat.querySelector('.body');
    if (!data.length) { body.innerHTML = '<div style="padding:24px;text-align:center;color:var(--muted);font-size:13px">표시할 데이터가 없습니다</div>'; return; }
    const dongs = Store.DONGS.filter(d => data.some(p => p.dong === d));
    const zoneGroupOf = {};
    data.forEach(p => { zoneGroupOf[p.zone] = p.zoneGroup; });
    const zones = Object.keys(zoneGroupOf).sort((a, b) => Store.GROUPS.indexOf(zoneGroupOf[a]) - Store.GROUPS.indexOf(zoneGroupOf[b]) || a.localeCompare(b, 'ko'));
    const cell = new Map();
    groupBy(data, p => p.dong + '\u0001' + p.zone).forEach((arr, k) => { cell.set(k, { v: Store.agg(arr.map(p => p.p26), st.metric), n: arr.length }); });
    let min = Infinity, max = -Infinity;
    cell.forEach(c => { if (c.v !== null) { min = Math.min(min, c.v); max = Math.max(max, c.v); } });
    const span = max - min;
    const th = 'style="padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;font-weight:600"';
    let html = '<div class="table-scroll" style="max-height:none;overflow-x:auto"><table class="data" style="border-collapse:separate;border-spacing:2px"><thead><tr><th ' + th + '>법정동</th>' +
      zones.map(z => `<th ${th.replace('border-bottom:1px solid var(--line);', `border-bottom:3px solid ${gcolor(zoneGroupOf[z])};`)}>${esc(z)}</th>`).join('') + '</tr></thead><tbody>';
    dongs.forEach(d => {
      html += `<tr><th style="text-align:left;white-space:nowrap;padding:6px 8px;position:static;cursor:default">${esc(d)}</th>`;
      zones.forEach(z => {
        const c = cell.get(d + '\u0001' + z);
        if (!c || c.v === null) {
          html += '<td style="text-align:center;color:var(--muted);padding:6px 8px;border:none">-</td>';
        } else {
          const t = span > 0 ? (c.v - min) / span : 1;
          const bg = alpha(gcolor(zoneGroupOf[z]), (0.12 + 0.78 * t).toFixed(2));
          html += `<td data-d="${esc(d)}" data-z="${esc(z)}" title="${esc(d)} · ${esc(z)} · ${c.n}필지 · ${Store.fmtWon(c.v)}원/㎡" style="text-align:center;padding:6px 8px;border:none;border-radius:6px;cursor:pointer;background:${bg};color:var(--text);font-weight:${t > 0.6 ? 700 : 400}">${Store.fmtMan(c.v).replace('만', '')}</td>`;
        }
      });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    body.innerHTML = html;
  }

  cHeat.addEventListener('click', e => {
    const td = e.target.closest('td[data-d]');
    if (td) Store.set({ filters: { dong: [td.dataset.d], zone: [td.dataset.z] } });
  });

  Store.subscribe(st => {
    const filt = Store.filtered();
    const data = Store.priced();
    drawDong(st, data);
    drawZone(st, data);
    drawJimok(st, filt);
    drawScatter(st, data);
    drawHeat(st, data);
  });
})();

</script>
<script>
(function () {
  const PAGE = 100;
  const tableEl = document.getElementById('sec-table');
  const qualEl = document.getElementById('sec-quality');

  function h(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function badges(flags) {
    const frag = document.createDocumentFragment();
    (flags || []).forEach(f => frag.appendChild(h('span', 'badge', Store.FLAG_LABEL[f] || f)));
    return frag;
  }
  function td(text, cls) { return h('td', cls, text); }
  function chgCell(chg) {
    const c = td(Store.fmtPct(chg), 'num');
    if (chg !== null && chg !== undefined) {
      if (chg > 0) c.classList.add('up'); else if (chg < 0) c.classList.add('down');
    }
    return c;
  }

  /* ---------- 상세 테이블 ---------- */
  const COLS = [
    { key: 'addr', label: '소재지', num: false },
    { key: 'jimok', label: '지목', num: false },
    { key: 'area', label: '면적(㎡)', num: true },
    { key: 'zone', label: '용도지역', num: false },
    { key: 'p25', label: '2025', num: true },
    { key: 'p26', label: '2026', num: true },
    { key: 'chg', label: '변동률', num: true }
  ];
  let sort = { key: 'chg', dir: -1 };
  let shown = PAGE;
  let rows = [];

  let titleCount, thead, tbody, moreWrap, emptyMsg;

  function buildTableShell() {
    tableEl.textContent = '';
    const h2 = h('h2', null, '필지 상세 ');
    titleCount = h('span', 'desc');
    titleCount.style.marginLeft = '6px';
    h2.appendChild(titleCount);
    tableEl.appendChild(h2);
    tableEl.appendChild(h('p', 'desc', '헤더를 클릭하면 정렬됩니다. 가격 집계 제외 필지도 경고 배지와 함께 표시됩니다.'));

    const wrap = h('div', 'table-scroll');
    const table = h('table', 'data');
    thead = h('thead');
    tbody = h('tbody');
    table.appendChild(thead);
    table.appendChild(tbody);
    wrap.appendChild(table);
    tableEl.appendChild(wrap);

    emptyMsg = h('p', 'desc', '조건에 맞는 필지가 없습니다');
    emptyMsg.style.display = 'none';
    emptyMsg.style.padding = '12px 0';
    tableEl.appendChild(emptyMsg);

    moreWrap = h('div');
    moreWrap.style.cssText = 'text-align:center;margin-top:12px';
    tableEl.appendChild(moreWrap);
  }

  function renderHead() {
    thead.textContent = '';
    const tr = h('tr');
    COLS.forEach(c => {
      const th = h('th', c.num ? 'num' : '', c.label + (sort.key === c.key ? (sort.dir > 0 ? ' ▲' : ' ▼') : ''));
      th.addEventListener('click', () => {
        if (sort.key === c.key) sort.dir = -sort.dir;
        else sort = { key: c.key, dir: c.num ? -1 : 1 };
        shown = PAGE;
        applySort();
        renderHead();
        renderBody();
      });
      tr.appendChild(th);
    });
    thead.appendChild(tr);
  }

  function applySort() {
    const k = sort.key, d = sort.dir;
    rows.sort((a, b) => {
      const x = a[k], y = b[k];
      const xn = x === null || x === undefined || x === '';
      const yn = y === null || y === undefined || y === '';
      if (xn && yn) return 0;
      if (xn) return 1;   // null은 항상 맨 뒤
      if (yn) return -1;
      if (typeof x === 'string') return d * x.localeCompare(y, 'ko');
      return d * (x - y);
    });
  }

  function renderBody() {
    tbody.textContent = '';
    moreWrap.textContent = '';
    emptyMsg.style.display = rows.length ? 'none' : '';
    const frag = document.createDocumentFragment();
    rows.slice(0, shown).forEach(p => {
      const tr = h('tr');
      const a = td(p.addr);
      if (p.flags && p.flags.length) { a.appendChild(document.createTextNode(' ')); a.appendChild(badges(p.flags)); }
      tr.appendChild(a);
      tr.appendChild(td(p.jimok || '-'));
      tr.appendChild(td(Store.fmtWon(p.area), 'num'));
      tr.appendChild(td(p.zone || '-'));
      tr.appendChild(td(Store.fmtWon(p.p25), 'num'));
      tr.appendChild(td(Store.fmtWon(p.p26), 'num'));
      tr.appendChild(chgCell(p.chg));
      frag.appendChild(tr);
    });
    tbody.appendChild(frag);
    if (rows.length > shown) {
      const remain = rows.length - shown;
      const btn = h('button', null, '더 보기 (' + Math.min(PAGE, remain) + '건 추가 · 남은 ' + remain.toLocaleString('ko-KR') + '건)');
      btn.style.cssText = 'font:inherit;font-size:13px;padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer';
      btn.addEventListener('click', () => { shown += PAGE; renderBody(); });
      moreWrap.appendChild(btn);
    }
  }

  function renderTable() {
    rows = Store.filtered().slice();
    shown = PAGE;
    titleCount.textContent = '· ' + rows.length.toLocaleString('ko-KR') + '건';
    applySort();
    renderHead();
    renderBody();
  }

  /* ---------- 데이터 품질 점검 (필터 무관, 1회) ---------- */
  function renderQuality() {
    qualEl.textContent = '';
    const all = Store.all;
    const flagged = all.filter(p => p.flags && p.flags.length);
    const excluded = all.filter(p => p.excluded).length;

    qualEl.appendChild(h('h2', null, '데이터 품질 점검'));
    qualEl.appendChild(h('p', 'desc',
      '전체 ' + all.length.toLocaleString('ko-KR') + '필지 기준(필터 무관). 가격 집계 제외 ' + excluded + '건 — 가격·변동률 통계에서 빠지며, 면적 0·지목 없음은 가격 집계에는 포함되고 면적/지목 차트에서만 제외됩니다. ' +
      '자릿수 의심(scale)은 2026 값이 2025의 1% 미만인 경우입니다.'));

    const counts = h('div');
    counts.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px';
    Object.keys(Store.FLAG_LABEL).forEach(f => {
      const n = all.filter(p => p.flags && p.flags.includes(f)).length;
      const chip = h('span', 'badge', Store.FLAG_LABEL[f] + ' ' + n + '건');
      if (!n) chip.style.opacity = '0.5';
      counts.appendChild(chip);
    });
    qualEl.appendChild(counts);

    if (!flagged.length) {
      qualEl.appendChild(h('p', 'desc', '플래그가 있는 필지가 없습니다'));
      return;
    }
    const wrap = h('div', 'table-scroll');
    wrap.style.maxHeight = '360px';
    const table = h('table', 'data');
    const hr = h('tr');
    [['소재지', 0], ['지목', 0], ['2025', 1], ['2026', 1], ['플래그', 0]].forEach(c => {
      const th = h('th', c[1] ? 'num' : '', c[0]);
      th.style.cursor = 'default';
      hr.appendChild(th);
    });
    const thead = h('thead'); thead.appendChild(hr);
    const body = h('tbody');
    flagged.forEach(p => {
      const tr = h('tr');
      tr.appendChild(td(p.addr));
      tr.appendChild(td(p.jimok || '-'));
      tr.appendChild(td(Store.fmtWon(p.p25), 'num'));
      tr.appendChild(td(Store.fmtWon(p.p26), 'num'));
      const f = td(''); f.appendChild(badges(p.flags)); tr.appendChild(f);
      body.appendChild(tr);
    });
    table.appendChild(thead); table.appendChild(body);
    wrap.appendChild(table);
    qualEl.appendChild(wrap);
  }

  if (tableEl) {
    buildTableShell();
    Store.subscribe(renderTable);
  }
  if (qualEl) renderQuality();
})();

</script>
</body>
</html>
